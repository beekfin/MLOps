# Единственная точка конфигурации ДЗ 5. В src/ нет ни имени модели,
# ни learning rate, ни путей.
model:
  name: "Qwen/Qwen3-0.6B"
  device: "auto"            # auto | cpu | cuda | mps
  # float32 — рекомендованный в задании режим для CPU.
  dtype: "float32"
  enable_thinking: false    # как в ДЗ 4: шаблон должен совпадать с обучением

data:
  # Выход стадии tokenize из ДЗ 4. У студента — свой путь.
  train: "data/tokenized/train.pt"
  val: "data/tokenized/val.pt"

lora:
  r: 8
  alpha: 16                 # итоговый масштаб апдейта alpha / r = 2
  dropout: 0.05
  # Только проекции внимания и MLP. embed_tokens и lm_head — это 155 млн
  # параметров каждый; в modules_to_save они уезжают в адаптер целиком.
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

train:
  seed: 42
  epochs: 1
  batch_size: 1
  grad_accum: 8             # эффективный батч = 8, меньший расход памяти
  lr: 2.0e-4
  warmup_ratio: 0.03
  weight_decay: 0.0
  max_grad_norm: 1.0
  eval_every: 10            # шагов оптимизатора между замерами val loss
  # Оценка по одному примеру: длины из ДЗ 4 доходят до 1280 токенов.
  eval_batch_size: 1
  gradient_checkpointing: true   # без него на ноутбуке с 16–32 ГБ не влезает
  max_steps: null           # null — по эпохам; число — обрезать (smoke-тесты)

# Эксперимент по слоям: второй прогон без адаптеров на первых N слоях.
variants:
  - name: "all_layers"
    freeze_first: 0
  - name: "freeze14"
    freeze_first: 14

compare:
  max_new_tokens: 40
  # Пять фиксированных вопросов Ask Ubuntu из validation ДЗ 3.
  prompts:
    - "How to install MariaDB?\n\nWhat is the most stable/safest way to install MariaDB?"
    - "How can I install urxvt terminal on Ubuntu 18.04?\n\nHow I can install the urxvt terminal?"
    - "How do I install Tox?\n\nApparently Tox is a free and secure replacement of Skype. I like it, but, how do I install it?"
    - "Where is gparted in Ubuntu?\n\nHow do I find gparted in Ubuntu, searching from the launcher sends me to Wiki or shopping?"
    - "How do I install a FTP Server?\n\nHow to configure FTP server in my Ubuntu 12.04 or 13.04.What to install and how to configure."
  system: "Provide a concise, accurate answer to this Ubuntu package-management question."

paths:
  models: "models"
  metrics: "metrics"
  curves: "docs/curves.png"
  compare: "docs/compare.md"
