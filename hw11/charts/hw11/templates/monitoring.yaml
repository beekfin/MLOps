apiVersion: v1
kind: ServiceAccount
metadata: {name: hw11-prometheus}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: hw11-prometheus}
rules:
  - apiGroups: [""]
    resources: [pods, nodes, nodes/proxy, endpoints, services]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: hw11-prometheus}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: hw11-prometheus}
subjects: [{kind: ServiceAccount, name: hw11-prometheus, namespace: hw11}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: hw11-prometheus}
data:
  prometheus.yml: |
{{ .Files.Get "files/prometheus.yml" | indent 4 }}
  rules.yml: |
{{ .Files.Get "files/rules.yml" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: hw11-prometheus
      securityContext: {runAsUser: 65534, fsGroup: 65534}
      containers:
        - name: prometheus
          image: {{ .Values.monitoring.prometheusImage | quote }}
          args: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.path=/prometheus, --storage.tsdb.retention.time=2h, --storage.tsdb.retention.size=128MB, --web.enable-lifecycle]
          ports: [{containerPort: 9090}]
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 400m, memory: 256Mi}
          volumeMounts: [{name: config, mountPath: /etc/prometheus}, {name: data, mountPath: /prometheus}]
      volumes:
        - {name: config, configMap: {name: hw11-prometheus}}
        - {name: data, emptyDir: {sizeLimit: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus}
spec:
  selector: {app: prometheus}
  ports: [{port: 9090, targetPort: 9090}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: hw11-grafana}
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: hw11
        options: {path: /dashboards}
  dashboard.json: |
{{ .Files.Get "files/dashboard.json" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana}
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      securityContext: {runAsUser: 472, fsGroup: 472}
      containers:
        - name: grafana
          image: {{ .Values.monitoring.grafanaImage | quote }}
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false"}
          ports: [{containerPort: 3000}]
          resources:
            requests: {cpu: 30m, memory: 96Mi}
            limits: {cpu: 300m, memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /etc/grafana/provisioning/datasources/datasource.yml, subPath: datasource.yml}
            - {name: config, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml}
            - {name: config, mountPath: /dashboards/dashboard.json, subPath: dashboard.json}
            - {name: data, mountPath: /var/lib/grafana}
      volumes:
        - {name: config, configMap: {name: hw11-grafana}}
        - {name: data, emptyDir: {sizeLimit: 128Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: grafana}
spec:
  selector: {app: grafana}
  ports: [{port: 3000, targetPort: 3000}]
