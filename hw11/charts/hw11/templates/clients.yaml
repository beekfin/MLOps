{{- range $i := until 4 }}
apiVersion: v1
kind: Pod
metadata:
  name: client-{{ $i }}
  labels: {app: hw11-client}
spec:
  securityContext: {runAsUser: 10001, fsGroup: 10001}
  containers:
    - name: client
      image: {{ $.Values.image | quote }}
      imagePullPolicy: Never
      command: [python, -c, "import time; time.sleep(86400)"]
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 250m, memory: 128Mi}
      volumeMounts: [{name: work, mountPath: /work}]
  volumes: [{name: work, emptyDir: {sizeLimit: 32Mi}}]
---
{{- end }}
