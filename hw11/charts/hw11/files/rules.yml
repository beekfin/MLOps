groups:
  - name: hw11
    rules:
      - alert: HighFirstChunkLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(hw11_ttfc_seconds_bucket[30s]))) > 0.5 and sum(increase(hw11_ttfc_seconds_count[30s])) >= 10
        for: 8s
        labels: {severity: warning}
        annotations: {summary: 'TTFC p95 выше 0,5 с при минимум 10 успешных ответах за 30 с'}
      - alert: HighRejectionRate
        expr: sum(rate(hw11_requests_total{outcome=~"rejected|not_ready"}[30s])) / clamp_min(sum(rate(hw11_requests_total[30s])), 0.001) > 0.1 and sum(increase(hw11_requests_total[30s])) >= 10
        for: 8s
        labels: {severity: warning}
        annotations: {summary: 'Доля отказов выше 10% при минимум 10 исходах за 30 с'}
