# Единственная точка конфигурации ДЗ 3.

collect:
  # v1 является базовой выборкой, v2 расширяет её новыми примерами.
  version: "v2"
  n_rows:
    v1: 1800
    v2: 3000
  sources:
    v1:
      - "source/askubuntu.jsonl"
    v2:
      - "source/askubuntu.jsonl"
  system_prompts:
    - "You are an Ubuntu support assistant. Give a clear and practical solution to the user's package-management question."
    - "Help the user solve an Ubuntu software installation or package-management problem. Keep the answer technically precise."
    - "Act as an Ubuntu technical support specialist. Answer the user's question with an actionable solution."
    - "Provide a concise, accurate answer to this Ubuntu package-management question."
    - "You assist Ubuntu users with APT, dpkg, Snap, repositories, and software installation. Explain the solution clearly."

clean:
  min_user_chars: 30
  max_user_chars: 4000
  min_assistant_chars: 2
  near_dup:
    enabled: true
    shingle_words: 4
    num_perm: 64
    threshold: 0.85
  pii:
    enabled: true

diversity:
  min_examples: 1000
  min_system_prompts: 3
  min_groups: 50
  max_group_share: 0.10
  min_answer_len_ratio: 1.6
  max_same_length_share: 0.25
  max_duplicate_answer_share: 0.30

split:
  group_key: "topic"
  ratios:
    train: 0.8
    val: 0.1
    test: 0.1
  seed: 42

contamination:
  threshold: 0.85

paths:
  raw: "data/raw.jsonl"
  clean: "data/clean.jsonl"
  train: "data/train.jsonl"
  val: "data/val.jsonl"
  test: "data/test.jsonl"
  metrics_collect: "metrics/collect.json"
  metrics_clean: "metrics/clean.json"
  metrics_split: "metrics/split.json"
  metrics_diversity: "metrics/diversity.json"
  datasheet: "docs/datasheet.md"
